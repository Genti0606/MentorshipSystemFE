<mat-toolbar class="top-bar">
  <button mat-icon-button type="button" aria-label="Toggle navigation" (click)="toggleSidenav()">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="app-name">Mentorship System</span>
  <span class="spacer"></span>
  <mat-icon aria-label="notifications">notifications</mat-icon>
  <mat-icon aria-label="profile">account_circle</mat-icon>
</mat-toolbar>

<mat-sidenav-container class="dashboard-layout">
  <mat-sidenav mode="side" opened class="side-menu">
    <mat-nav-list aria-label="Main navigation">
      <a mat-list-item routerLink="/" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/find-mentors" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <mat-icon matListItemIcon>search</mat-icon>
        <span matListItemTitle>Find Mentors</span>
      </a>
      <a mat-list-item routerLink="/my-courses" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <mat-icon matListItemIcon>menu_book</mat-icon>
        <span matListItemTitle>My Courses</span>
      </a>
      <a mat-list-item routerLink="/sessions" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <mat-icon matListItemIcon>event</mat-icon>
        <span matListItemTitle>Sessions</span>
      </a>
      <a mat-list-item routerLink="/resources" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <mat-icon matListItemIcon>folder</mat-icon>
        <span matListItemTitle>Resources</span>
      </a>
      <a mat-list-item routerLink="/profile" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <mat-icon matListItemIcon>person</mat-icon>
        <span matListItemTitle>Profile</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>

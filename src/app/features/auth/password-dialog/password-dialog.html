<h2 mat-dialog-title>Change password</h2>
<mat-dialog-content>
  @if (message) {
    <p class="notice" role="alert">{{ message }}</p>
  }
  <form id="password-form" #form="ngForm" (ngSubmit)="save()">
    <label
      >Current password<input
        name="current"
        type="password"
        [(ngModel)]="current"
        required
        autocomplete="current-password"
    /></label>
    <label
      >New password<input
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        minlength="8"
        autocomplete="new-password"
    /></label>
    <label
      >Confirm new password<input
        name="confirm"
        type="password"
        [(ngModel)]="confirm"
        required
        minlength="8"
        autocomplete="new-password"
    /></label>
    <p>Use at least 8 characters.</p>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" mat-dialog-close [disabled]="busy">Cancel</button>
  <button class="primary" type="submit" form="password-form" [disabled]="form.invalid || busy">
    {{ busy ? 'Saving…' : 'Save password' }}
  </button>
</mat-dialog-actions>
